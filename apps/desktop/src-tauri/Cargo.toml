[package]
name = "api-lab-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
rust-core = { workspace = true }
grpc-client = { workspace = true }
fix-client = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
base64 = { workspace = true }
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-opener = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-build", "tauri/custom-protocol"]
