name: Release Client

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave blank for v<version> from tauri.conf.json)'
        required: false
        default: ''
      draft:
        description: 'Draft release (set to false to publish immediately)'
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:ts

      - name: Build and Release Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          uploadWorkflowArtifacts: true
          tagName: ${{ inputs.tag_name || 'v__VERSION__' }}
          releaseName: "API Lab ${{ inputs.tag_name || 'v__VERSION__' }}"
          releaseBody: "Release build of API Lab desktop client for Windows and macOS."
          releaseDraft: ${{ inputs.draft }}
          prerelease: false
          args: ${{ matrix.args }}
