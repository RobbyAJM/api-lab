[workspace]
resolver = "2"
members = [
    "apps/server",
    "apps/desktop/src-tauri",
    "packages/rust-core",
    "packages/grpc-client",
]

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
prost = "0.13"
prost-types = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
tonic-reflection = "0.12"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
aes-gcm = "0.10"
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
futures = "0.3"
tokio-stream = "0.1"
http = "1.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
regex = "1.11"
rust-core = { path = "packages/rust-core" }
grpc-client = { path = "packages/grpc-client" }
